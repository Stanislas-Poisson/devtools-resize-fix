name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'


permissions:
  contents: write
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Tag matches manifest.json
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          MANIFEST_VERSION=$(jq -r '.version' manifest.json)
          
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi
          echo "Tag matches manifest version: $TAG_VERSION"

      - name: Run build.sh
        run: bash build.sh

      - name: Compute SHA-256 Checksum
        run: |
          ZIP_FILE=$(ls dist/*.zip | head -n 1)
          sha256sum "$ZIP_FILE" > "${ZIP_FILE}.sha256"
          echo "SHA-256 generated for $ZIP_FILE"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
